name: iicp-directory-operator

x-app-environment: &app-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${IICP_APP_URL:?set IICP_APP_URL}
  APP_KEY_FILE: /run/secrets/app_key
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${IICP_LOG_LEVEL:-warning}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${IICP_DB_DATABASE:?set IICP_DB_DATABASE}
  DB_USERNAME: ${IICP_DB_USERNAME:?set IICP_DB_USERNAME}
  DB_PASSWORD_FILE: /run/secrets/db_password
  CACHE_STORE: database
  SESSION_DRIVER: database
  QUEUE_CONNECTION: sync
  IICP_SCHEDULER_ENABLED: "true"

x-app-runtime: &app-runtime
  image: iicp-directory-operator:${IICP_IMAGE_TAG:-local}
  environment: *app-environment
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
    - /app/bootstrap/cache:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
  volumes:
    - app_storage:/app/storage
    - runtime_secrets:/run/secrets:ro
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: ${IICP_APP_MEMORY:-512m}
  cpus: ${IICP_APP_CPUS:-1.0}
  restart: unless-stopped

services:
  secret-init:
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        cp /run/secrets/app_key_input /prepared/app_key
        cp /run/secrets/db_password_input /prepared/db_password
        chmod 0400 /prepared/app_key /prepared/db_password
        chown 10001:10001 /prepared/app_key /prepared/db_password
    secrets:
      - app_key_input
      - db_password_input
    volumes:
      - runtime_secrets:/prepared
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    restart: "no"

  db:
    image: mariadb:11.4@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
    environment:
      MARIADB_DATABASE: ${IICP_DB_DATABASE:?set IICP_DB_DATABASE}
      MARIADB_USER: ${IICP_DB_USERNAME:?set IICP_DB_USERNAME}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password_input
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password_input
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${IICP_DB_MEMORY:-1g}
    cpus: ${IICP_DB_CPUS:-1.0}
    restart: unless-stopped

  migrate:
    <<: *app-runtime
    profiles: ["tools"]
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    depends_on:
      db:
        condition: service_healthy
      secret-init:
        condition: service_completed_successfully
    restart: "no"

  app:
    <<: *app-runtime
    build:
      context: .
      dockerfile: Dockerfile.operator
    depends_on:
      db:
        condition: service_healthy
      secret-init:
        condition: service_completed_successfully

  scheduler:
    <<: *app-runtime
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    depends_on:
      db:
        condition: service_healthy
      secret-init:
        condition: service_completed_successfully

  web:
    image: iicp-directory-operator-nginx:${IICP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.operator-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${IICP_OPERATOR_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${IICP_WEB_MEMORY:-128m}
    cpus: ${IICP_WEB_CPUS:-0.5}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/iicp/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  app_storage:
  db_data:
  runtime_secrets:

secrets:
  app_key_input:
    file: ${IICP_APP_KEY_FILE:?set IICP_APP_KEY_FILE}
  db_password_input:
    file: ${IICP_DB_PASSWORD_FILE:?set IICP_DB_PASSWORD_FILE}
  db_root_password:
    file: ${IICP_DB_ROOT_PASSWORD_FILE:?set IICP_DB_ROOT_PASSWORD_FILE}
