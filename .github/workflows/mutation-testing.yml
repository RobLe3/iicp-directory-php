        with:
          php-version: '8.3'
          coverage: xdebug
          extensions: mbstring, pdo_sqlite, sqlite3
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs build
      - run: composer install --no-interaction --prefer-dist
      - name: Mutate node-readiness
        run: |
          ./vendor/bin/infection --no-progress --threads=2 \
            --only-covering-test-cases \
            --with-timeouts --max-timeouts=0 \
            --min-msi=60 --min-covered-msi=60 \
            --logger-text="build/infection-node-readiness.log" \
            --logger-summary-json="build/infection-node-readiness.json" \
            app/Services/NodeReadinessPolicy.php \
            tests/Unit/NodeReadinessPolicyCharacterizationTest.php
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
