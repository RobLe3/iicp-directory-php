name: Control-plane parity

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: control-plane-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, sqlite3
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      # The exact truschery/kanon compatibility pin is intentional; Composer
      # reports it as a publishing warning, so validation is not run --strict.
      - run: composer validate --no-interaction
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked --no-interaction
      - run: php artisan test --compact
      - run: python3 scripts/verify_release.py --version "$(cat VERSION)" --allow-untagged
      # Preserve the reviewed extraction snapshot without treating current public
      # development as a live mirror of a private tree.
      - run: python3 scripts/check_seed_parity.py --manifest parity/seed-manifest-v1.10.76.2.json --php-dir . --git-revision c489d4e02a636b337ba4237f8543f83675162db0

  event-log-concurrency:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: iicp_concurrency
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_KEY: base64:+Ks8E2HpJxEHq4rM2oNxGTVmAqFZXbmGiJvHaJXwXn4=
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: iicp_concurrency
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pcntl, pdo_mysql, sodium
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan migrate:fresh --force
      - run: php artisan test --compact tests/Feature/NodeEventLoggerConcurrencyTest.php tests/Feature/CreditLedgerConcurrencyTest.php

  operator-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build hardened operator images
        run: |
          docker build -f Dockerfile.operator -t iicp-directory-operator:test .
          docker build -f Dockerfile.operator-nginx -t iicp-directory-operator-nginx:test .
      - name: Verify non-root, read-only and fail-closed runtime
        run: ./scripts/test_operator_image.sh
      - name: Rehearse disposable operator lifecycle
        run: IICP_IMAGE_TAG=test ./scripts/rehearse_operator_stack.sh --skip-build
