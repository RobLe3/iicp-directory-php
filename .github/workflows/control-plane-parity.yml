name: Control-plane parity

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: control-plane-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: xdebug
          extensions: mbstring, pdo_sqlite, sqlite3
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs build
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan test --compact --coverage-clover=build/coverage.xml
      - name: Enforce evidence-based coverage floors
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--clover build/coverage.xml --minimum 90)
          if [[ -n "$COVERAGE_BASE" && "$COVERAGE_BASE" != "0000000000000000000000000000000000000000" ]]; then
            args+=(--changed-since "$COVERAGE_BASE" --changed-minimum 80)
          fi
          python3 scripts/check_coverage_floor.py "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: php-coverage
          path: build/coverage.xml
          retention-days: 14

  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - run: composer install --no-interaction --prefer-dist
      - run: composer quality:static
      - run: composer quality:format
      - run: python3 scripts/check_semgrep_suppressions.py
      - run: python3 -m unittest scripts/test_semgrep_suppression_policy.py
      - run: python3 -m unittest scripts/test_secret_hygiene.py
      - run: python3 scripts/check_secret_hygiene.py
      - run: python3 -m unittest scripts/test_coverage_floor.py
      - run: python3 -m unittest scripts/test_operator_upgrade_rehearsal.py
      - run: scripts/test_shared_hosting_runtime_artifact.sh
      - run: python3 -m pip install 'semgrep==1.164.0'
      - run: semgrep scan --config .semgrep/php-security.yml --severity ERROR --error app routes config database

  php-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, sqlite3
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      # The exact truschery/kanon compatibility pin is intentional; Composer
      # reports it as a publishing warning, so validation is not run --strict.
      - run: composer validate --no-interaction
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked --no-interaction
      - run: php artisan test --compact
      - run: python3 scripts/verify_release.py --version "$(cat VERSION)" --allow-untagged
      # Preserve the reviewed extraction snapshot without treating current public
      # development as a live mirror of a private tree.
      - run: python3 scripts/check_seed_parity.py --manifest parity/seed-manifest-v1.10.76.2.json --php-dir . --git-revision c489d4e02a636b337ba4237f8543f83675162db0

  event-log-concurrency:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: iicp_concurrency
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: testing
      APP_KEY: '00000000000000000000000000000000'
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: iicp_concurrency
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pcntl, pdo_mysql, sodium
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan migrate:fresh --force
      - run: php artisan test --compact tests/Feature/NodeEventLoggerConcurrencyTest.php tests/Feature/CreditLedgerConcurrencyTest.php tests/Feature/ReputationVelocityConcurrencyTest.php tests/Feature/RestrictedDomainMembershipConcurrencyTest.php

  operator-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build hardened operator images
        run: |
          docker build -f Dockerfile.operator -t iicp-directory-operator:test .
          docker build -f Dockerfile.operator-nginx -t iicp-directory-operator-nginx:test .
      - name: Scan application image configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile.operator
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan proxy image configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile.operator-nginx
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Scan application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iicp-directory-operator:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan proxy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: iicp-directory-operator-nginx:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Verify non-root, read-only and fail-closed runtime
        run: ./scripts/test_operator_image.sh
      - name: Verify clean-build application/runtime reproducibility
        run: |
          docker build --no-cache -f Dockerfile.operator -t iicp-directory-operator:repro .
          docker build --no-cache -f Dockerfile.operator-nginx -t iicp-directory-operator-nginx:repro .
          ./scripts/test_operator_reproducibility.sh \
            iicp-directory-operator:test iicp-directory-operator:repro
          ./scripts/test_operator_reproducibility.sh \
            iicp-directory-operator-nginx:test iicp-directory-operator-nginx:repro
      - name: Rehearse disposable operator lifecycle
        run: IICP_IMAGE_TAG=test ./scripts/rehearse_operator_stack.sh --skip-build
      - name: Smoke-test synthetic capacity harness
        run: |
          IICP_IMAGE_TAG=test IICP_CAPACITY_SAMPLES=4 IICP_CAPACITY_CONCURRENCY=1,4 \
            IICP_CAPACITY_FAIL_ON_ERRORS=1 \
            ./scripts/run_operator_capacity_reference.sh "$RUNNER_TEMP/operator-capacity-smoke.json"
