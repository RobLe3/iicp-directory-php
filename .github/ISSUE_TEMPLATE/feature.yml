name: Feature proposal
description: Propose a directory implementation change.
title: "[proposal] "
body:
  - type: markdown
    attributes:
      value: Protocol semantics belong in RobLe3/IICP. This form is for PHP implementation work.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the observable outcome.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and protocol impact
      description: Identify affected APIs, fixtures and any linked IICP proposal.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privacy considerations
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide binary, testable criteria.
    validations:
      required: true
